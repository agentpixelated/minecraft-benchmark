name: Final benchmark validation

on:
  push:
    paths:
      - '.github/workflows/_final-validation.yml'

permissions:
  contents: write

jobs:
  windows-prepare:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Full Windows prepare through user launcher
        shell: powershell
        run: .\run-windows.ps1 --prepare-only --accept-eula

  linux-quick-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1
      - name: Baseline and full-stack OpenGL/Vulkan through user launcher
        run: xvfb-run -a ./run-linux.sh --quick --configs sodium,sodium_full --accept-eula
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-linux-validation-results
          path: results/
          if-no-files-found: ignore
          retention-days: 3

  record:
    if: always()
    needs: [windows-prepare, linux-quick-benchmark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record final validation conclusions
        env:
          WINDOWS_RESULT: ${{ needs.windows-prepare.result }}
          LINUX_RESULT: ${{ needs.linux-quick-benchmark.result }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci
          printf '{"source_sha":"%s","windows_prepare":"%s","linux_quick_benchmark":"%s"}\n' "$SOURCE_SHA" "$WINDOWS_RESULT" "$LINUX_RESULT" > ci/final-validation.json
          cat ci/final-validation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add ci/final-validation.json
          git commit -m 'Record final benchmark validation' || true
          git push
