name: Temporary integration smoke collector

on:
  workflow_run:
    workflows: ['Integration smoke test']
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record completed integration run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p ci
          gh run view "$RUN_ID" --json databaseId,status,conclusion,url,jobs > ci/integration-smoke-last.json
          cat ci/integration-smoke-last.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add ci/integration-smoke-last.json
          git commit -m 'Record temporary integration smoke result' || true
          git push
