name: Super Resolution benchmark smoke

on:
  push:
    paths:
      - '.github/workflows/super-resolution-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: super-resolution-smoke
  cancel-in-progress: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record live SR smoke run ID
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci
          printf '{"run_id":%s,"source_sha":"%s","status":"started"}\n' "$RUN_ID" "$SOURCE_SHA" > ci/super-resolution-live.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add ci/super-resolution-live.json
          git commit -m 'Record live Super Resolution smoke run' || true
          git push

  windows-prepare:
    needs: announce
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SR benchmark through Windows user launcher
        shell: pwsh
        env:
          MC_EULA_ACCEPTED: '1'
        run: .\run-windows.ps1 --quick --super-resolution --configs "sr_native,sr_mod_disabled,sr_fsr1_quality" --accept-eula --prepare-only

  linux-runtime:
    needs: announce
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1
      - name: Run native, disabled-overhead, FSR1 and SGSR1 profiles
        env:
          MC_EULA_ACCEPTED: '1'
        run: xvfb-run -a ./run-linux.sh --quick --super-resolution --configs sr_native,sr_mod_disabled,sr_fsr1_quality,sr_sgsr1_quality --accept-eula
      - name: Verify SR profile proof and result schema
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('results/latest-summary.json'))
          assert d['matrix']['mode']=='super_resolution', d['matrix']
          assert d['matrix']['backend']=='opengl'
          rows=d['raw_runs']
          assert len(rows)==4, len(rows)
          by={r['config']:r for r in rows}
          for cid in ['sr_native','sr_mod_disabled','sr_fsr1_quality','sr_sgsr1_quality']:
              r=by[cid]
              assert r.get('backend')=='opengl' and r.get('backend_proven') is True, (cid,r.get('reason'))
          for cid in ['sr_fsr1_quality','sr_sgsr1_quality']:
              sr=by[cid].get('super_resolution',{})
              assert sr.get('proven') is True, (cid,sr,by[cid].get('reason'))
              assert sr.get('algorithm_initialized') is True, (cid,sr)
          suites=d['suite_results']['configs']
          assert suites['sr_native']['suites']['super_resolution']['status']=='measured'
          assert suites['sr_fsr1_quality']['suites']['super_resolution']['vs_native_pct'] is not None
          print(json.dumps({
            'status':'success',
            'profiles':{cid:{
              'fps':suites[cid]['suites']['super_resolution']['opengl'],
              'vs_native_pct':suites[cid]['suites']['super_resolution'].get('vs_native_pct'),
              'render_scale':suites[cid]['suites']['super_resolution'].get('profile',{}).get('render_scale')
            } for cid in suites},
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: super-resolution-smoke-results
          path: |
            results/
            .mcbench/game/logs/
            .mcbench/game/config/super_resolution/config.toml
          if-no-files-found: ignore
          retention-days: 7

  record:
    if: always()
    needs: [windows-prepare, linux-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.linux-runtime.result == 'success'
        with:
          name: super-resolution-smoke-results
          path: downloaded
      - name: Record final SR smoke status
        env:
          WINDOWS_RESULT: ${{ needs.windows-prepare.result }}
          LINUX_RESULT: ${{ needs.linux-runtime.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ci
          python3 - <<'PY'
          import json, os, pathlib
          status={
            'run_id':int(os.environ['RUN_ID']),
            'source_sha':os.environ['SOURCE_SHA'],
            'windows_prepare':os.environ['WINDOWS_RESULT'],
            'linux_runtime':os.environ['LINUX_RESULT'],
          }
          candidates=list(pathlib.Path('downloaded').rglob('latest-summary.json')) if pathlib.Path('downloaded').exists() else []
          if not candidates and pathlib.Path('downloaded').exists():
              candidates=list(pathlib.Path('downloaded').rglob('summary.json'))
          if candidates:
              d=json.load(candidates[0].open())
              status['matrix']=d.get('matrix')
              status['invalid_runs']=len(d.get('aggregate',{}).get('invalid_runs',[]))
              profiles={}
              for cid,item in d.get('suite_results',{}).get('configs',{}).items():
                  sr=item.get('suites',{}).get('super_resolution',{})
                  if sr.get('status')=='measured':
                      profiles[cid]={
                        'fps':sr.get('opengl'),
                        'vs_native_pct':sr.get('vs_native_pct'),
                        'render_scale':sr.get('profile',{}).get('render_scale'),
                      }
              status['profiles']=profiles
          status['status']='success' if status['windows_prepare']=='success' and status['linux_runtime']=='success' else 'failure'
          pathlib.Path('ci/super-resolution-status.json').write_text(json.dumps(status,indent=2)+'\n')
          print(json.dumps(status,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add ci/super-resolution-status.json
          git commit -m 'Record Super Resolution smoke result' || true
          git push
