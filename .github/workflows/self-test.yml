name: Cross-platform self-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install portablemc==4.4.1 psutil
      - name: Compile Python sources
        run: python -m compileall -q benchmark.py run-agent.py mcbench
      - name: Validate benchmark config
        run: python -c "import json; json.load(open('benchmark-config.json', encoding='utf-8')); print('config ok')"
      - name: Run repository self-test
        run: python benchmark.py --self-test
      - name: Run AI-agent contract self-test
        run: python run-agent.py --self-test --json-out agent-self-test.json
      - name: Validate AI-agent self-test output
        run: python -c "import json; d=json.load(open('agent-self-test.json')); assert d['status']=='self-test-ok', d; print(d)"
