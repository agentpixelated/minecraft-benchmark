name: Integration smoke test

on:
  push:
    paths:
      - '.github/workflows/integration-smoke.yml'
      - 'run-agent.py'
      - 'AGENTS.md'
      - 'mcbench/**'
      - 'benchmark-config.json'
      - 'objectbench/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-prepare:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve every mod and build full Windows benchmark environment through user launcher
        shell: powershell
        run: .\run-windows.ps1 --prepare-only --accept-eula

  linux-quick-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1
      - name: Run OpenGL and Vulkan through user launcher with baseline and full stack
        run: xvfb-run -a ./run-linux.sh --quick --configs sodium,sodium_full --accept-eula
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-integration-smoke-results
          path: |
            results/
            .mcbench/game/logs/latest.log
          if-no-files-found: ignore
          retention-days: 3

  ai-agent-quick-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run AI-agent/headless path without preinstalled display stack
        env:
          AI_AGENT_NAME: github-actions-agent
          MC_EULA_ACCEPTED: '1'
        run: python3 run-agent.py --quick --configs sodium,sodium_badoptimizations,sodium_bbe,sodium_full
      - name: Verify machine-readable agent result
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('agent-result.json'))
          assert d['mode']=='ai-agent', d
          assert d['status']=='success', d
          assert d['invalid_runs']==0, d
          assert d['valid_runs']==8, d
          print(json.dumps({k:d[k] for k in ('status','agent','headless','valid_runs','invalid_runs')}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-integration-smoke-results
          path: |
            agent-result.json
            results/
            .mcbench/game/logs/latest.log
          if-no-files-found: ignore
          retention-days: 3

  record:
    if: always()
    needs: [windows-prepare, linux-quick-benchmark, ai-agent-quick-benchmark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record three-platform integration status
        env:
          WINDOWS_RESULT: ${{ needs.windows-prepare.result }}
          LINUX_RESULT: ${{ needs.linux-quick-benchmark.result }}
          AGENT_RESULT: ${{ needs.ai-agent-quick-benchmark.result }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci
          printf '{"source_sha":"%s","windows":"%s","linux":"%s","ai_agent":"%s"}\n' "$SOURCE_SHA" "$WINDOWS_RESULT" "$LINUX_RESULT" "$AGENT_RESULT" > ci/integration-smoke.json
          cat ci/integration-smoke.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add ci/integration-smoke.json
          git commit -m 'Record three-platform integration smoke result' || true
          git push
