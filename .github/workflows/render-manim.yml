name: Render Manim Integral

on:
  push:
    branches:
      - manim-integral-demo
    paths:
      - integral_x2_manim.py
      - .github/workflows/render-manim.yml
  pull_request:
    branches:
      - main
    paths:
      - integral_x2_manim.py
      - .github/workflows/render-manim.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:v0.19.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Render animation
        run: manim -qh integral_x2_manim.py IntegralXSquared
      - name: Verify output
        run: |
          test -f media/videos/integral_x2_manim/1080p60/IntegralXSquared.mp4
          ls -lh media/videos/integral_x2_manim/1080p60/IntegralXSquared.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: integral-x2-manim
          path: media/videos/integral_x2_manim/1080p60/IntegralXSquared.mp4
          if-no-files-found: error
