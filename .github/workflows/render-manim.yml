name: Render Slow Integral Derivative

on:
  push:
    branches:
      - manim-integral-demo
    paths:
      - integral_derivative_slow.py
      - .github/workflows/render-manim.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:v0.19.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Render animation
        run: manim -qh integral_derivative_slow.py IntegralAndDerivativeSlow
      - name: Verify output
        run: |
          test -f media/videos/integral_derivative_slow/1080p60/IntegralAndDerivativeSlow.mp4
          ls -lh media/videos/integral_derivative_slow/1080p60/IntegralAndDerivativeSlow.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: integral-derivative-slow
          path: media/videos/integral_derivative_slow/1080p60/IntegralAndDerivativeSlow.mp4
          if-no-files-found: error
