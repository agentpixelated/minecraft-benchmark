name: Render Linear Drag Solution

on:
  push:
    branches:
      - manim-integral-demo
    paths:
      - gaya_hambat_visual.py
      - .github/workflows/render-manim.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:v0.19.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Render animation
        run: manim -qh gaya_hambat_visual.py DragForceSolution
      - name: Verify output
        run: |
          test -f media/videos/gaya_hambat_visual/1080p60/DragForceSolution.mp4
          ls -lh media/videos/gaya_hambat_visual/1080p60/DragForceSolution.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: linear-drag-solution-manim
          path: media/videos/gaya_hambat_visual/1080p60/DragForceSolution.mp4
          if-no-files-found: error
