name: Preview Deep Physics Drag Solution

on:
  push:
    branches:
      - manim-integral-demo
    paths:
      - gaya_hambat_visual.py
      - .github/workflows/render-manim.yml
  pull_request:
    branches:
      - main
    paths:
      - gaya_hambat_visual.py
      - .github/workflows/render-manim.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:v0.19.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Render preview
        run: manim -qm gaya_hambat_visual.py LinearDragDeepDive
      - name: Verify preview
        run: |
          test -f media/videos/gaya_hambat_visual/720p30/LinearDragDeepDive.mp4
          ls -lh media/videos/gaya_hambat_visual/720p30/LinearDragDeepDive.mp4
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: deep-physics-drag-preview
          path: media/videos/gaya_hambat_visual/720p30/LinearDragDeepDive.mp4
          if-no-files-found: error
