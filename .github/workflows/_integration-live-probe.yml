name: Temporary integration run probe

on:
  push:
    paths:
      - '.github/workflows/_integration-live-probe.yml'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record recent integration runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci
          gh run list --workflow integration-smoke.yml --limit 8 --json databaseId,status,conclusion,createdAt,headSha > ci/integration-runs-live.json
          cat ci/integration-runs-live.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add ci/integration-runs-live.json
          git commit -m 'Record temporary integration run status' || true
          git push
