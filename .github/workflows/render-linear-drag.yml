name: Render Linear Drag Solution

on:
  pull_request:
    branches:
      - main
    paths:
      - linear_drag_solution.py
      - .github/workflows/render-linear-drag.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: manimcommunity/manim:v0.19.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Render animation
        run: manim -qh linear_drag_solution.py LinearDragSolution
      - name: Verify output
        run: |
          test -f media/videos/linear_drag_solution/1080p60/LinearDragSolution.mp4
          ls -lh media/videos/linear_drag_solution/1080p60/LinearDragSolution.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: linear-drag-solution
          path: media/videos/linear_drag_solution/1080p60/LinearDragSolution.mp4
          if-no-files-found: error
